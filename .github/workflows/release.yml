name: Publish to npm
# Publishes the checked-out tag. npm trusts this workflow through OIDC
# (npmjs.com → package settings → Trusted publishing), so no token or one-time
# code is stored anywhere. Run it by hand (Actions → Publish to npm → Run
# workflow, on a v* tag) until trusted publishing is set up; then trigger it on
# `push: tags: ['v*']` instead.
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: The tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance --access public
